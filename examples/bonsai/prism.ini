; llama.cpp preset for Prism ML's Bonsai 2 27B on Prism's llama.cpp build.
; A plain llama.cpp preset: it also works with "llama serve --models-preset prism.ini".
; llamaenv gives it only to the prism runtime's router. A context size that
; you pick in the Llama app still wins over ctx-size here.
;
; Measured on an RTX 3080 Laptop GPU (16 GB) under Windows, with the desktop
; using 3 to 4 GB of it:
; - llama.cpp's defaults (4 slots, context fitted to all free VRAM): GPU full, about 7 tok/s
; - 96K context, 1 slot, 16-bit context cache: GPU full, about 7.5 tok/s
; - 96K context, 1 slot, 8-bit context cache (below): 14.7 GB used, 39.3 tok/s
[prism-ml/Ternary-Bonsai-2-27B-gguf:PQ2_0]
ctx-size = 98304
parallel = 1
cache-type-k = q8_0
cache-type-v = q8_0
