; llama.cpp preset for Prism ML's Bonsai 2 27B on Prism's llama.cpp build.
; A plain llama.cpp preset: it also works with "llama serve --models-preset prism.ini".
; llamaenv gives it only to the prism runtime's router. The Llama app's own
; context choice still wins over ctx-size here.
;
; Fixed values, measured on an RTX 3080 Laptop GPU (16 GB) under Windows:
; llama.cpp's defaults (4 slots, context fitted to all free VRAM) fill the GPU
; and slow decoding to about 7 tok/s.
[prism-ml/Ternary-Bonsai-2-27B-gguf:PQ2_0]
ctx-size = 98304
parallel = 1
