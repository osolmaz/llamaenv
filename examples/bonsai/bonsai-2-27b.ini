; llama.cpp preset for Prism ML's Bonsai 2 27B on Prism's llama.cpp build.
; A plain llama.cpp preset: it also works with "llama serve --models-preset bonsai-2-27b.ini".
; llamaenv gives it only to the prism runtime's router, next to the presets of
; other models on that runtime. A context size that you pick in the Llama app
; still wins over ctx-size here.
;
; hf-repo names the model files, so this section loads on its own, also when
; the client names the model differently. The macOS Llama app lists the same
; file as ":unknown", because its quant list has no PQ2_0 yet; pick ":PQ2_0".
;
; One slot, so one chat gets the whole context. Without "parallel", llama.cpp
; picks 4 slots, and the context is split between them.
; Measured on an RTX 3080 Laptop GPU (16 GB) under Windows, with no other model
; on the GPU: 14.7 GB used, 39 tok/s.
[prism-ml/Ternary-Bonsai-2-27B-gguf:PQ2_0]
hf-repo = prism-ml/Ternary-Bonsai-2-27B-gguf:PQ2_0
ctx-size = 98304
parallel = 1
