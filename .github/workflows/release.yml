name: Release

# Pushing a tag vX.Y.Z on main runs every CI check, then publishes the
# release archives with SHA256SUMS.
on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check that the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: ./scripts/build-release.sh "$GITHUB_REF_NAME" dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "llamaenv $GITHUB_REF_NAME"
