name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SLOPHAMMER_VERSION: v0.5.0
  GOLANGCI_LINT_VERSION: v2.11.0

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install checkers
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
          go install github.com/osolmaz/slophammer/go/cmd/slophammer-go@${SLOPHAMMER_VERSION}
      - name: Check gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test ./...
      - run: golangci-lint run ./...
      - run: GOOS=windows golangci-lint run ./...
      - run: ./scripts/check-go-coverage.sh
      - run: slophammer-go dry .
      - run: slophammer-go crap .
      - run: slophammer-go check .

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build -o dist/ .
